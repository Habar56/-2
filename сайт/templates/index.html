<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Погода</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f7; 
               display: flex; justify-content: center; padding-top: 60px; }
        .card { background: #fff; padding: 30px 40px; border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0,0,0,.1); width: 340px; }
        h1 { text-align: center; font-size: 20px; }
        input, button { width: 100%; padding: 10px; margin-top: 8px;
                        border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #3b82f6; color: #fff; border: none; cursor: pointer; }
        button:hover { background: #2563eb; }
        .temp { font-size: 42px; font-weight: bold; text-align: center; }
        .desc { text-align: center; text-transform: capitalize; color: #555; }
        .row { display: flex; justify-content: space-between; margin-top: 6px; }
        .error { color: #c00; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌤 Погода</h1>

        <form method="POST">
            <input type="text" name="city" placeholder="Введите город"
                   value="{{ city }}" required>
            <button type="submit">Узнать погоду</button>
        </form>

        {% if weather %}
            {% if weather.error %}
                <p class="error">{{ weather.error }}</p>
            {% else %}
                <h2 style="text-align:center">{{ weather.city }}</h2>
                <img src="https://openweathermap.org/img/wn/{{ weather.icon }}@2x.png"
                     style="display:block;margin:0 auto" alt="">
                <div class="temp">{{ weather.temp }}°C</div>
                <p class="desc">{{ weather.desc }}</p>
                <div class="row"><span>Ощущается</span><span>{{ weather.feels }}°C</span></div>
                <div class="row"><span>Влажность</span><span>{{ weather.humidity }}%</span></div>
            {% endif %}
        {% endif %}
    </div>
</body>
</html>
